<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topics — φQ Physics</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .topics-hero {
      background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 0 1rem;
    }
    .unit-tabs {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .unit-tab {
      padding: 0.5rem 1.1rem; border-radius: 100px;
      font-size: 0.85rem; font-weight: 600;
      border: 1.5px solid var(--border);
      background: none; cursor: pointer;
      color: var(--text-muted);
      transition: var(--t); font-family: var(--font-sans);
    }
    .unit-tab:hover { border-color: var(--border-2); color: var(--text); }
    .unit-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .search-topics {
      width: 100%; max-width: 380px;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 100px; color: var(--text);
      font-family: var(--font-sans); font-size: 0.9rem;
      outline: none; transition: var(--t);
    }
    .search-topics:focus { border-color: var(--accent); box-shadow: var(--glow-sm); }
    .search-topics::placeholder { color: var(--text-dim); }
    .search-wrap { position: relative; display: inline-block; }
    .search-wrap svg { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    /* TOPIC ACCORDION */
    .topic-accord {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 0.6rem;
      overflow: hidden;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .topic-accord.open { border-color: var(--border-2); }
    .topic-accord-hd {
      width: 100%; display: flex; align-items: center;
      gap: 1rem; padding: 1.2rem 1.5rem;
      background: none; border: none;
      cursor: pointer; text-align: left;
      color: var(--text); font-family: var(--font-sans);
      transition: background var(--t);
    }
    .topic-accord-hd:hover { background: var(--surface2); }
    .topic-code {
      font-family: var(--font-mono); font-size: 0.8rem;
      font-weight: 700; color: var(--accent);
      background: var(--accent-dim);
      padding: 0.2rem 0.55rem; border-radius: 6px;
      flex-shrink: 0; min-width: 38px; text-align: center;
    }
    .topic-title-wrap { flex: 1; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .topic-name { font-weight: 600; font-size: 1rem; color: var(--text); }
    .topic-level-dots { font-size: 0.6rem; color: var(--gold); letter-spacing: 3px; }
    .topic-chevron {
      flex-shrink: 0; color: var(--text-muted);
      transition: transform 0.25s ease;
    }
    .topic-accord.open .topic-chevron { transform: rotate(180deg); }
    .topic-done-btn {
      flex-shrink: 0;
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid var(--border-2);
      background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--t); font-size: 0.8rem;
      user-select: none;
    }
    .topic-done-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
    .topic-done-btn:hover:not(.done) { border-color: var(--green); color: var(--green); }

    .topic-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .topic-accord.open .topic-body { max-height: 1200px; }
    .topic-content {
      padding: 0 1.5rem 1.5rem;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    @media(max-width:680px){ .topic-content{ grid-template-columns: 1fr; } }

    .tc-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.1rem;
    }
    .tc-box-title {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted); margin-bottom: 0.6rem;
    }
    .tc-box ul { padding-left: 1rem; }
    .lesson-links { display: grid; gap: 0.35rem; }
    .lesson-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.6rem; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 0.88rem; color: var(--text); text-decoration: none;
      transition: var(--t); line-height: 1.35;
    }
    .lesson-link:hover { border-color: var(--accent); box-shadow: var(--glow-sm); opacity: 1; }
    .ll-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
    }
    .ll-arrow { margin-left: auto; color: var(--text-dim); font-size: 0.85rem; }
    .lesson-link:hover .ll-arrow { color: var(--accent); }
    .tc-box li {
      font-size: 0.88rem; color: var(--text-2);
      line-height: 1.6; margin-bottom: 0.2rem;
    }
    .eq-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .eq-row {
      font-family: var(--font-mono); font-size: 0.88rem;
      color: var(--accent); background: var(--surface);
      padding: 0.4rem 0.7rem; border-radius: 6px;
      border: 1px solid var(--border);
    }
    .topic-footer {
      display: flex; align-items: center;
      gap: 1rem; flex-wrap: wrap;
      padding: 0.75rem 1.5rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    /* PROGRESS */
    .progress-bar-wrap {
      background: var(--surface2); border-radius: 100px;
      height: 6px; overflow: hidden; flex: 1;
    }
    .progress-bar-fill {
      height: 100%; background: var(--green);
      border-radius: 100px;
      transition: width 0.5s ease;
    }
    .unit-header-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem;
    }
  </style>
</head>
<body>
<script src="shared/nav.js"></script>

<!-- Hero -->
<div class="topics-hero">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem">
      <div>
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
          <span class="section-label" style="margin-bottom:0">IB Physics 2023</span>
          <h1 style="font-size:1.6rem;margin:0;display:inline">Syllabus Topics</h1>
          <span style="color:var(--text-muted);font-size:0.88rem">— 25 topics · HL &amp; SL · click to expand</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="topic-search" class="search-topics" type="text" placeholder="Search topics…" autocomplete="off">
        </div>
        <div id="progress-label" style="font-size:0.85rem;color:var(--text-muted);white-space:nowrap">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Main content -->
<div class="container" style="padding-top:1.5rem;padding-bottom:3rem" id="app-root">
  <div style="color:var(--text-muted);text-align:center;padding:4rem 0">Loading topics…</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

/* Lesson pages for a topic id, from shared/lessons.js */
const LESSON_DIR = {};
(window.PHYQ_TOPICS || []).forEach(t => { LESSON_DIR[t.id] = t; });

/* ── COMPONENTS ───────────────────────────────────────────────── */
function TopicAccordion({ topic, unitColor, isOpen, onToggle, isDone, onToggleDone }) {
  return (
    <div className={`topic-accord${isOpen ? ' open' : ''}`} id={topic.id}>
      <button
        className="topic-accord-hd"
        onClick={onToggle}
        aria-expanded={isOpen}
      >
        <span className="topic-code" style={{ color: unitColor, background: `${unitColor}18` }}>
          {topic.code}
        </span>
        <span className="topic-title-wrap">
          <span className="topic-name">{topic.name}</span>
          <span className="topic-level-dots">{topic.level}</span>
          {topic.hl.length > 0 && (
            <span className="tag tag-purple" style={{ fontSize: '0.67rem', padding: '0.1rem 0.5rem' }}>HL</span>
          )}
        </span>
        <div
          className={`topic-done-btn${isDone ? ' done' : ''}`}
          onClick={e => { e.stopPropagation(); onToggleDone(); }}
          title={isDone ? 'Marked as done' : 'Mark as done'}
          role="checkbox"
          aria-checked={isDone}
          tabIndex={0}
          onKeyDown={e => { if(e.key===' '||e.key==='Enter'){e.stopPropagation();onToggleDone();} }}
        >
          {isDone ? '✓' : ''}
        </div>
        <svg className="topic-chevron" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2.2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <div className="topic-body">
        <div className="topic-content">
          <div>
            <div className="tc-box">
              <div className="tc-box-title">
                {LESSON_DIR[topic.id] ? 'Lessons — click to open' : 'Key Concepts'}
              </div>
              {LESSON_DIR[topic.id]
                ? <div className="lesson-links">
                    {LESSON_DIR[topic.id].lessons.map((l,i) => (
                      <a key={i} className="lesson-link"
                         href={`syllabus-content/${LESSON_DIR[topic.id].folder}/${l.f}`}>
                        <span className="ll-num" style={{ background: `${unitColor}22`, color: unitColor }}>{l.f.slice(0,2)}</span>
                        <span>{l.t}</span>
                        <span className="ll-arrow">→</span>
                      </a>
                    ))}
                  </div>
                : <ul>
                    {topic.concepts.map((c,i) => <li key={i}>{c}</li>)}
                  </ul>}
            </div>
            {topic.hl.length > 0 && (
              <div className="tc-box" style={{ marginTop: '0.75rem', borderColor: 'var(--accent2)', background: 'var(--accent2-dim)' }}>
                <div className="tc-box-title" style={{ color: 'var(--accent2)' }}>HL Extensions</div>
                <ul>
                  {topic.hl.map((h,i) => <li key={i} style={{ color: 'var(--accent2)' }}>{h}</li>)}
                </ul>
              </div>
            )}
          </div>
          <div>
            <div className="tc-box">
              <div className="tc-box-title">Key Equations</div>
              <div className="eq-list">
                {topic.equations.map((eq,i) => (
                  <div key={i} className="eq-row">{eq}</div>
                ))}
              </div>
            </div>
            {topic.note && (
              <div className="tc-box" style={{ marginTop: '0.75rem', borderLeft: `3px solid ${unitColor}` }}>
                <div className="tc-box-title">📌 Examiner Note</div>
                <p style={{ fontSize: '0.86rem', color: 'var(--text-2)', lineHeight: '1.6' }}>{topic.note}</p>
              </div>
            )}
          </div>
        </div>
        <div className="topic-footer">
          {LESSON_DIR[topic.id] &&
            <a href={`syllabus-content/${LESSON_DIR[topic.id].folder}/index.html`} className="btn btn-primary btn-sm">
              Open {LESSON_DIR[topic.id].lessons.length} lessons →
            </a>}
          <a href={`practice.html?topic=${topic.id}`} className="btn btn-ghost btn-sm">
            Practice questions →
          </a>
          <a href={`resources.html#formulas`} className="btn btn-secondary btn-sm">
            Formula sheet
          </a>
          {isDone
            ? <span className="tag tag-green" style={{ marginLeft: 'auto' }}>✓ Mastered</span>
            : <button className="btn btn-sm" onClick={e => { e.stopPropagation(); onToggleDone(); }}
                style={{ marginLeft: 'auto', background: 'var(--green-dim)', color: 'var(--green)' }}>
                Mark as mastered
              </button>
          }
        </div>
      </div>
    </div>
  );
}

function UnitSection({ unit, doneTopics, toggleDone, openTopics, toggleOpen, query }) {
  const filtered = unit.topics.filter(t =>
    !query ||
    t.name.toLowerCase().includes(query) ||
    t.code.toLowerCase().includes(query) ||
    t.concepts.some(c => c.toLowerCase().includes(query))
  );
  if (!filtered.length) return null;

  const doneCount = unit.topics.filter(t => doneTopics.has(t.id)).length;
  const pct = Math.round(doneCount / unit.topics.length * 100);

  return (
    <div style={{ marginBottom: '3rem' }} id={`unit-${unit.id}`}>
      <div className="unit-header-row">
        <div>
          <div className="section-label" style={{ color: unit.color }}>
            Unit {unit.id} — {unit.label}
          </div>
          <h2 style={{ color: unit.color, fontSize: '1.5rem', marginBottom: '0.25rem' }}>
            {unit.name}
          </h2>
          <p style={{ fontSize: '0.85rem' }}>
            {unit.topics.length} topics &nbsp;·&nbsp; {doneCount} mastered
          </p>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', minWidth: '160px' }}>
          <div className="progress-bar-wrap" style={{ flex: 1 }}>
            <div className="progress-bar-fill" style={{ width: `${pct}%`, background: unit.color }} />
          </div>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem', color: unit.color, minWidth: '32px' }}>
            {pct}%
          </span>
        </div>
      </div>

      {filtered.map(topic => (
        <TopicAccordion
          key={topic.id}
          topic={topic}
          unitColor={unit.color}
          isOpen={openTopics.has(topic.id)}
          onToggle={() => toggleOpen(topic.id)}
          isDone={doneTopics.has(topic.id)}
          onToggleDone={() => toggleDone(topic.id)}
        />
      ))}
    </div>
  );
}

/* ── APP ──────────────────────────────────────────────────────── */
function App() {
  const DONE_KEY = 'phyq-done-topics';
  const [doneTopics, setDoneTopics] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); }
    catch { return new Set(); }
  });
  const [openTopics, setOpenTopics] = useState(new Set());
  const [query, setQuery]     = useState('');
  const [activeUnit, setActiveUnit] = useState('all');

  const allTopics = UNITS.flatMap(u => u.topics);
  const totalDone = doneTopics.size;

  useEffect(() => {
    localStorage.setItem(DONE_KEY, JSON.stringify([...doneTopics]));
    // Update progress label
    const el = document.getElementById('progress-label');
    if (el) el.textContent = `${totalDone} / ${allTopics.length} topics mastered`;
  }, [doneTopics]);

  // Handle URL hash on load
  useEffect(() => {
    const hash = window.location.hash.replace('#','');
    if (hash) {
      setOpenTopics(s => new Set([...s, hash]));
      setTimeout(() => {
        const el = document.getElementById(hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 300);
    }
    // Wire search input
    const searchEl = document.getElementById('topic-search');
    if (searchEl) searchEl.addEventListener('input', e => setQuery(e.target.value.toLowerCase().trim()));
  }, []);

  const toggleDone = useCallback(id => {
    setDoneTopics(s => {
      const next = new Set(s);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }, []);

  const toggleOpen = useCallback(id => {
    setOpenTopics(s => {
      const next = new Set(s);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }, []);

  const shownUnits = activeUnit === 'all'
    ? UNITS
    : UNITS.filter(u => u.id === activeUnit);

  return (
    <div>
      {/* Unit tab filter */}
      <div className="unit-tabs">
        {['all','A','B','C','D','E'].map(u => (
          <button
            key={u}
            className={`unit-tab${activeUnit === u ? ' active' : ''}`}
            onClick={() => setActiveUnit(u)}
          >
            {u === 'all' ? 'All Units' : `Unit ${u}`}
          </button>
        ))}
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
          <div className="progress-bar-wrap" style={{ width: '120px' }}>
            <div className="progress-bar-fill" style={{ width: `${Math.round(totalDone/allTopics.length*100)}%` }} />
          </div>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.82rem', color: 'var(--green)' }}>
            {totalDone}/{allTopics.length}
          </span>
        </div>
      </div>

      {/* Units */}
      {shownUnits.map(unit => (
        <UnitSection
          key={unit.id}
          unit={unit}
          doneTopics={doneTopics}
          toggleDone={toggleDone}
          openTopics={openTopics}
          toggleOpen={toggleOpen}
          query={query}
        />
      ))}

      {shownUnits.every(u => u.topics.filter(t =>
        !query || t.name.toLowerCase().includes(query) || t.code.toLowerCase().includes(query)
      ).length === 0) && (
        <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '3rem' }}>
          No topics match "{query}" — try a different search term.
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
