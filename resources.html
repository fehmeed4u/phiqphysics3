<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources — φQ Physics</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .res-hero {
      background: linear-gradient(135deg, var(--surface) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border); padding: 3.5rem 0 2.5rem;
    }
    .tab-row { display:flex; gap:0.35rem; flex-wrap:wrap; margin-bottom:3rem;
      border-bottom:1px solid var(--border); padding-bottom:0; }
    .res-tab {
      padding:0.7rem 1.2rem; border-radius:var(--radius) var(--radius) 0 0;
      font-size:0.88rem; font-weight:600; cursor:pointer;
      border:1px solid transparent; border-bottom:none;
      background:none; color:var(--text-muted);
      transition:var(--t); font-family:var(--font-sans);
      position:relative; bottom:-1px;
    }
    .res-tab:hover { color:var(--text); }
    .res-tab.active {
      background:var(--surface); border-color:var(--border);
      border-bottom-color:var(--surface); color:var(--accent);
    }
    .formula-search {
      width:100%; max-width:400px; padding:0.65rem 1rem 0.65rem 2.5rem;
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:100px; color:var(--text);
      font-family:var(--font-sans); font-size:0.9rem;
      outline:none; transition:var(--t); margin-bottom:1.5rem;
    }
    .formula-search:focus { border-color:var(--accent); box-shadow:var(--glow-sm); }
    .formula-search::placeholder { color:var(--text-dim); }
    .formula-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:0.75rem;
    }
    .tip-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:1.5rem;
      border-left:4px solid var(--accent);
      transition:var(--t);
    }
    .tip-card:hover { border-color:var(--border-2); box-shadow:var(--glow-sm); }
    .tip-num {
      font-family:var(--font-serif); font-size:2rem;
      font-weight:700; color:var(--accent); opacity:0.3;
      line-height:1; margin-bottom:0.5rem;
    }
    .paper-row {
      display:flex; align-items:center; gap:1rem;
      padding:1rem 1.25rem; background:var(--surface);
      border:1px solid var(--border); border-radius:var(--radius);
      margin-bottom:0.5rem; transition:var(--t); flex-wrap:wrap;
    }
    .paper-row:hover { border-color:var(--border-2); }
    .video-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); overflow:hidden;
      transition:border-color var(--t), transform var(--t);
    }
    .video-card:hover { border-color:var(--border-2); transform:translateY(-3px); }
    .video-thumb {
      aspect-ratio:16/9; position:relative;
      background:var(--surface2);
    }
    .video-play {
      position:absolute; inset:0; display:flex;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.35);
    }
    .video-play-btn {
      width:52px; height:52px; border-radius:50%;
      background:rgba(79,157,255,0.9);
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; color:#fff;
    }
    .video-body { padding:1rem 1.1rem; }
    .ws-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:1.4rem;
      display:flex; flex-direction:column; gap:0.75rem;
      transition:var(--t);
    }
    .ws-card:hover { border-color:var(--border-2); box-shadow:var(--glow-sm); }
    .contact-form input, .contact-form textarea {
      width:100%; padding:0.8rem 1rem;
      background:var(--surface2); border:1.5px solid var(--border);
      border-radius:var(--radius); color:var(--text);
      font-family:var(--font-sans); font-size:0.92rem;
      outline:none; transition:var(--t); margin-bottom:0.75rem;
    }
    .contact-form input:focus, .contact-form textarea:focus {
      border-color:var(--accent); box-shadow:var(--glow-sm);
    }
    .contact-form textarea { min-height:120px; resize:vertical; }
  </style>
</head>

const TIPS = [
  { title:'Read the question twice', color:'var(--accent)', tip:'Underline the command term (calculate, state, explain, discuss, outline). Each has a specific expected response length and style. "State" needs one sentence; "explain" needs mechanism + consequence.' },

/* ── TAB PANELS ────────────────────────────────────────────────── */
function FormulasTab() {
  const [q, setQ] = useState('');
  const [unitF, setUnitF] = useState('all');
  const filtered = useMemo(() => FORMULAS.filter(f => {
    const match = !q || f.eq.toLowerCase().includes(q) || f.name.toLowerCase().includes(q) || f.topic.toLowerCase().includes(q) || f.vars.toLowerCase().includes(q);
    const unit  = unitF === 'all' || f.unit === unitF;
    return match && unit;
  }), [q, unitF]);

  return (
    <div>
      <div style={{ display:'flex', gap:'1rem', flexWrap:'wrap', marginBottom:'1.5rem', alignItems:'center' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"
            style={{ position:'absolute', left:'0.8rem', top:'50%', transform:'translateY(-50%)', color:'var(--text-muted)' }}>
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input className="formula-search" style={{ margin:0 }} value={q} onChange={e => setQ(e.target.value.toLowerCase())}
            placeholder="Search equations, topic, variable…" />
        </div>
        <div style={{ display:'flex', gap:'0.3rem', flexWrap:'wrap' }}>
          {['all','A','B','C','D','E'].map(u => (
            <button key={u} onClick={() => setUnitF(u)}
              style={{ padding:'0.35rem 0.75rem', borderRadius:100, fontSize:'0.8rem', fontWeight:600,
                border:`1.5px solid ${unitF===u ? (u==='all'?'var(--accent)':UNIT_COLORS[u]) : 'var(--border)'}`,
                background: unitF===u ? (u==='all'?'var(--accent)':UNIT_COLORS[u]) : 'none',
                color: unitF===u ? '#fff' : 'var(--text-muted)',
                cursor:'pointer', fontFamily:'var(--font-sans)', transition:'var(--t)' }}>
              {u==='all'?'All':u}
            </button>
          ))}
        </div>
        <span style={{ fontSize:'0.82rem', color:'var(--text-muted)' }}>{filtered.length} formulas</span>
      </div>
      <div className="formula-grid">
        {filtered.map((f, i) => (
          <div key={i} className="formula-card">
            <div className="formula-name">{f.name}</div>
            <div className="formula-eq">{f.eq}</div>
            <div className="formula-vars">{f.vars}</div>
            <div style={{ marginTop:'0.5rem' }}>
              <span style={{ fontSize:'0.7rem', fontWeight:700, color:UNIT_COLORS[f.unit],
                background:`${UNIT_COLORS[f.unit]}18`, padding:'0.15rem 0.5rem', borderRadius:6 }}>
                {f.unit} · {f.topic}
              </span>
            </div>
          </div>
        ))}
      </div>
      {!filtered.length && <div style={{ textAlign:'center', color:'var(--text-muted)', padding:'3rem' }}>No formulas match "{q}"</div>}
    </div>
  );
}

        </div>
        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'var(--radius-lg)', padding:'1.5rem' }}>

/* ── APP ──────────────────────────────────────────────────────── */
const TABS = [
  { id:'formulas',   label:'Formula Sheet', icon:'∑',  anchor:'formulas' },
  { id:'tips',       label:'Exam Tips',     icon:'🎯',  anchor:'tips' },
  { id:'papers',     label:'Past Papers',   icon:'📄',  anchor:'papers' },
  { id:'videos',     label:'Videos',        icon:'🎬',  anchor:'videos' },
  { id:'worksheets', label:'Worksheets',    icon:'📋',  anchor:'worksheets' },
  { id:'contact',    label:'Contact',       icon:'✉️',  anchor:'contact' },
];

function App() {
  const hash = window.location.hash.replace('#','');
  const initial = TABS.find(t => t.anchor === hash) ? hash : 'formulas';
  const [active, setActive] = useState(initial);

  const Panel = {
    formulas:   <FormulasTab />,
    tips:       <TipsTab />,
    papers:     <PapersTab />,
    videos:     <VideosTab />,
    worksheets: <WorksheetsTab />,
    contact:    <ContactTab />,
  }[active];

  return (
    <div>
      <div className="tab-row">
        {TABS.map(t => (
          <button key={t.id} className={`res-tab${active === t.id ? ' active' : ''}`}
            onClick={() => { setActive(t.id); window.location.hash = t.anchor; }}>
            {t.icon} {t.label}
          </button>
        ))}
      </div>
      {Panel}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
