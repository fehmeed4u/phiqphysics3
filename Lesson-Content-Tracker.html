<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>φQ Physics — Lesson Content Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1c; color: #E8E4DB;
      min-height: 100vh; padding: 2rem 1rem;
    }

    .page { max-width: 960px; margin: 0 auto; }

    /* HEADER */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid rgba(79,157,255,0.15);
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; }
    .logo span:first-child { color: #4F9DFF; }
    .logo span:nth-child(2) { color: #7B6EF6; }
    .logo-sub { font-size: 0.82rem; color: #7A8699; margin-top: 0.15rem; font-family: 'Inter', sans-serif; font-weight: 400; }

    .header-stats {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-n { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #4F9DFF; line-height: 1; }
    .stat-l { font-size: 0.7rem; color: #7A8699; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.2rem; }

    /* PROGRESS BAR */
    .progress-section { margin-bottom: 2rem; }
    .prog-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: #7A8699; margin-bottom: 0.5rem; }
    .prog-bar { height: 8px; background: #131929; border-radius: 100px; overflow: hidden; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, #4F9DFF, #7B6EF6); border-radius: 100px; transition: width 0.5s ease; }

    /* COPY BUTTON */
    .copy-section {
      background: #0d1221; border: 1px solid rgba(79,157,255,0.2);
      border-radius: 14px; padding: 1.25rem 1.5rem;
      margin-bottom: 2rem; display: flex;
      align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .copy-info h4 { font-size: 0.95rem; color: #E8E4DB; margin-bottom: 0.25rem; }
    .copy-info p { font-size: 0.82rem; color: #7A8699; }
    .copy-btn {
      padding: 0.6rem 1.4rem; background: #4F9DFF; color: #fff;
      border: none; border-radius: 100px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
      white-space: nowrap;
    }
    .copy-btn:hover { filter: brightness(1.1); }

    /* UNIT SECTIONS */
    .unit-section { margin-bottom: 2.5rem; }
    .unit-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(79,157,255,0.1);
    }
    .unit-letter {
      font-family: 'Playfair Display', serif; font-size: 2.2rem;
      font-weight: 700; line-height: 1;
    }
    .unit-name { font-size: 1rem; font-weight: 600; }
    .unit-count { font-size: 0.8rem; color: #7A8699; margin-top: 0.15rem; }
    .unit-prog {
      margin-left: auto; display: flex; align-items: center; gap: 0.6rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
    }
    .unit-prog-bar { width: 80px; height: 5px; background: #131929; border-radius: 100px; overflow: hidden; }
    .unit-prog-fill { height: 100%; border-radius: 100px; transition: width 0.5s; }

    /* LESSON ROWS */
    .lesson-row {
      display: grid;
      grid-template-columns: 28px 48px 1fr auto auto;
      gap: 0.75rem; align-items: center;
      padding: 0.75rem 1rem;
      background: #0d1221; border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px; margin-bottom: 0.4rem;
      transition: border-color 0.15s;
    }
    .lesson-row:hover { border-color: rgba(79,157,255,0.2); }
    .lesson-row.done { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.04); }
    .lesson-row.in-progress { border-color: rgba(245,166,35,0.3); background: rgba(245,166,35,0.04); }

    .lesson-check {
      width: 20px; height: 20px; border-radius: 5px;
      border: 1.5px solid rgba(79,157,255,0.3);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 0.75rem;
      transition: all 0.15s; flex-shrink: 0;
      background: transparent;
    }
    .lesson-check.done { background: #34D399; border-color: #34D399; color: #fff; }
    .lesson-check.in-progress { background: rgba(245,166,35,0.2); border-color: #F5A623; color: #F5A623; }

    .lesson-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; font-weight: 600;
      padding: 0.2rem 0.5rem; border-radius: 6px;
      text-align: center; white-space: nowrap;
    }
    .lesson-name { font-size: 0.88rem; color: #C0BAB0; }
    .lesson-name strong { color: #E8E4DB; font-weight: 600; }

    .level-tag {
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0.15rem 0.5rem; border-radius: 100px;
      white-space: nowrap;
    }
    .level-sl { background: rgba(79,157,255,0.12); color: #4F9DFF; border: 1px solid rgba(79,157,255,0.2); }
    .level-hl { background: rgba(123,110,246,0.12); color: #7B6EF6; border: 1px solid rgba(123,110,246,0.2); }

    .status-select {
      font-size: 0.75rem; padding: 0.2rem 0.5rem;
      background: #131929; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: #7A8699;
      cursor: pointer; font-family: 'Inter', sans-serif;
      outline: none;
    }

    @media(max-width:600px){
      .lesson-row { grid-template-columns: 28px 1fr auto; }
      .lesson-code { display: none; }
      .status-select { display: none; }
    }

    /* GOOGLE DOC EXPORT */
    #gdoc-content {
      position: fixed; left: -9999px; top: 0;
      width: 800px; background: white; color: #000;
      font-family: Arial, sans-serif; font-size: 11pt;
      padding: 2rem;
    }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="logo"><span>φ</span><span>Q</span> <span style="color:#E8E4DB;font-weight:400;font-size:1.2rem">Physics</span></div>
      <div class="logo-sub">Lesson Content Tracker — IB Physics 2023 · Mr. Fahmeed Qadir</div>
    </div>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-n" id="total-lessons">80</div>
        <div class="stat-l">Total Lessons</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:#34D399" id="done-count">1</div>
        <div class="stat-l">Completed</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:#F5A623" id="progress-count">0</div>
        <div class="stat-l">In Progress</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:#7A8699" id="remaining-count">79</div>
        <div class="stat-l">Remaining</div>
      </div>
    </div>
  </div>

  <!-- OVERALL PROGRESS -->
  <div class="progress-section">
    <div class="prog-label">
      <span>Overall progress</span>
      <span id="prog-pct">1%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:1%"></div></div>
  </div>

  <!-- COPY TO GOOGLE DOCS -->
  <div class="copy-section">
    <div class="copy-info">
      <h4>📋 Copy to Google Docs</h4>
      <p>Click the button → paste into a new Google Doc (Ctrl+V / Cmd+V). All lessons and checkboxes will appear as a formatted table.</p>
    </div>
    <button class="copy-btn" onclick="copyToClipboard()">Copy lesson list →</button>
  </div>

  <!-- LESSONS BY UNIT -->
  <div id="lessons-container"></div>

</div>

<!-- Hidden Google Doc content -->
<div id="gdoc-content"></div>

<script>
const LESSONS = [
  // UNIT A
  { unit:'A', unitName:'Space, Time and Motion', color:'#4F9DFF',
    topics:[
      { code:'A.1', name:'Kinematics', level:'SL/HL', concepts:[
        'Displacement, Velocity and Acceleration',
        'Uniformly Accelerated Motion — SUVAT',
        'Graphs of Motion',
        'Projectile Motion',
        'Relative Motion',
      ]},
      { code:'A.2', name:'Forces and Momentum', level:'SL/HL', concepts:[
        "Newton's Laws of Motion",
        'Free Body Diagrams',
        'Friction and Normal Force',
        'Momentum and Impulse',
        'Conservation of Momentum',
      ]},
      { code:'A.3', name:'Work, Energy and Power', level:'SL/HL', concepts:[
        'Work Done by a Force',
        'Kinetic and Gravitational Potential Energy',
        'Conservation of Mechanical Energy',
        'Power and Efficiency',
        'Elastic and Inelastic Collisions',
      ]},
      { code:'A.4', name:'Rigid Body Mechanics', level:'HL only', concepts:[
        'Torque and Moment of Force',
        'Angular Velocity and Acceleration',
        'Moment of Inertia',
        'Rotational Kinetic Energy',
        'Angular Momentum',
      ]},
      { code:'A.5', name:'Galilean and Special Relativity', level:'HL only', concepts:[
        'Galilean Relativity',
        "Einstein's Postulates",
        'Time Dilation',
        'Length Contraction',
        'Mass-Energy Equivalence',
        'Spacetime Diagrams',
      ]},
    ]
  },
  // UNIT B
  { unit:'B', unitName:'The Particulate Nature of Matter', color:'#7B6EF6',
    topics:[
      { code:'B.1', name:'Thermal Energy Transfers', level:'SL/HL', concepts:[
        'Specific Heat Capacity',
        'Specific Latent Heat',
        'Conduction',
        'Convection',
        'Radiation and Black-body Emission',
      ]},
      { code:'B.2', name:'Greenhouse Effect', level:'SL/HL', concepts:[
        'Solar Radiation and Albedo',
        'Energy Balance of Earth',
        'Greenhouse Gases and Mechanisms',
        'Enhanced Greenhouse Effect and Climate',
      ]},
      { code:'B.3', name:'Gas Laws', level:'SL/HL', concepts:[
        "Boyle's Law",
        "Charles's Law and Gay-Lussac's Law",
        'The Ideal Gas Equation',
        'Kinetic Theory of Gases',
        'Internal Energy',
      ]},
      { code:'B.4', name:'Thermodynamics', level:'HL only', concepts:[
        'First Law of Thermodynamics',
        'Thermodynamic Processes and p-V Diagrams',
        'The Carnot Cycle',
        'Entropy and the Second Law',
        'Heat Engines and Refrigerators',
      ]},
      { code:'B.5', name:'Current and Circuits', level:'SL/HL', concepts:[
        'Current, Voltage and Resistance',
        "Ohm's Law and I-V Characteristics",
        'Series and Parallel Circuits',
        'EMF and Internal Resistance',
        'Electrical Power and Energy',
      ]},
    ]
  },
  // UNIT C
  { unit:'C', unitName:'Wave Behaviour', color:'#00D4FF',
    topics:[
      { code:'C.1', name:'Simple Harmonic Motion', level:'SL/HL', concepts:[
        'Defining Simple Harmonic Motion ✅ DONE',
        'SHM Equations — Displacement, Velocity, Acceleration',
        'Energy in SHM',
        'The Simple Pendulum and Mass-Spring System',
        'Damping and Resonance',
      ]},
      { code:'C.2', name:'Wave Model', level:'SL/HL', concepts:[
        'Wave Properties — Amplitude, Frequency, Wavelength',
        'Transverse and Longitudinal Waves',
        'Wave Speed',
        'Intensity and Amplitude',
        'The Electromagnetic Spectrum',
      ]},
      { code:'C.3', name:'Wave Phenomena', level:'SL/HL', concepts:[
        'Transmission, Absorption and Scattering of Waves',
        'Reflection of Waves and Rays',
        'Refraction of Waves',
        'Principle of Superposition',
        'Constructive and Destructive Interference',
        "Young's Double-Slit Experiment",
        'Single-Slit Diffraction',
        'Polarisation',
      ]},
      { code:'C.4', name:'Standing Waves and Resonance', level:'SL/HL', concepts:[
        'Formation of Standing Waves',
        'Nodes and Antinodes',
        'Harmonics in Strings',
        'Harmonics in Pipes',
      ]},
      { code:'C.5', name:'Doppler Effect', level:'SL/HL', concepts:[
        'Doppler Effect for Sound',
        'Doppler Effect for Light — Redshift',
        'Applications of the Doppler Effect',
      ]},
    ]
  },
  // UNIT D
  { unit:'D', unitName:'Fields', color:'#F5A623',
    topics:[
      { code:'D.1', name:'Gravitational Fields', level:'SL/HL', concepts:[
        "Newton's Law of Gravitation",
        'Gravitational Field Strength',
        'Gravitational Potential',
        'Orbital Mechanics',
        "Kepler's Laws",
      ]},
      { code:'D.2', name:'Electric and Magnetic Fields', level:'SL/HL', concepts:[
        "Coulomb's Law",
        'Electric Field Strength',
        'Electric Potential',
        'Magnetic Fields and Flux Density',
        'Magnetic Flux',
      ]},
      { code:'D.3', name:'Motion in Electromagnetic Fields', level:'SL/HL', concepts:[
        'The Lorentz Force',
        'Circular Motion of Charges in a Magnetic Field',
        'The Velocity Selector',
        'The Hall Effect',
      ]},
      { code:'D.4', name:'Induction', level:'HL only', concepts:[
        "Faraday's Law of Electromagnetic Induction",
        "Lenz's Law",
        'Motional EMF',
        'AC Generators',
        'Transformers',
      ]},
    ]
  },
  // UNIT E
  { unit:'E', unitName:'Nuclear and Quantum Physics', color:'#34D399',
    topics:[
      { code:'E.1', name:'Structure of the Atom', level:'SL/HL', concepts:[
        'The Rutherford Scattering Experiment',
        'The Nuclear Model of the Atom',
        'Atomic Energy Levels',
        'Emission Spectra',
        'Absorption Spectra and the Bohr Model',
      ]},
      { code:'E.2', name:'Quantum Physics', level:'HL only', concepts:[
        'The Photoelectric Effect',
        'The Photon Model of Light',
        'The de Broglie Wavelength',
        'The Heisenberg Uncertainty Principle',
        'Wave-Particle Duality',
      ]},
      { code:'E.3', name:'Radioactive Decay', level:'SL/HL', concepts:[
        'Alpha, Beta and Gamma Radiation',
        'The Radioactive Decay Law',
        'Half-Life',
        'Activity and Decay Constant',
        'Nuclear Equations and Conservation Laws',
      ]},
      { code:'E.4', name:'Fission', level:'SL/HL', concepts:[
        'Nuclear Binding Energy',
        'Mass Defect and Energy Release',
        'Chain Reactions and Critical Mass',
        'Nuclear Fission Reactors',
      ]},
      { code:'E.5', name:'Fusion and Stars', level:'SL/HL', concepts:[
        'Nuclear Fusion Reactions',
        'Stellar Evolution',
        'The Hertzsprung-Russell Diagram',
        'Main Sequence, Giants and Remnants',
      ]},
    ]
  },
];

// Load saved state
const STORE = 'phyq-tracker-state';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){}

function saveState() {
  localStorage.setItem(STORE, JSON.stringify(state));
  updateStats();
}

function getLessonId(code, concept) {
  return `${code}__${concept.replace(/[^a-zA-Z0-9]/g,'_')}`;
}

function getStatus(code, concept) {
  return state[getLessonId(code, concept)] || 'todo';
}

function setStatus(code, concept, status) {
  state[getLessonId(code, concept)] = status;
  saveState();
  renderAll();
}

function updateStats() {
  let total = 0, done = 0, inprog = 0;
  LESSONS.forEach(u => u.topics.forEach(t => t.concepts.forEach(c => {
    total++;
    const st = getStatus(t.code, c);
    if (st === 'done') done++;
    if (st === 'progress') inprog++;
  })));
  const remaining = total - done - inprog;
  document.getElementById('total-lessons').textContent = total;
  document.getElementById('done-count').textContent = done;
  document.getElementById('progress-count').textContent = inprog;
  document.getElementById('remaining-count').textContent = remaining;
  const pct = Math.round(done / total * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

function renderAll() {
  const container = document.getElementById('lessons-container');
  container.innerHTML = '';

  LESSONS.forEach(unit => {
    const allConcepts = unit.topics.flatMap(t => t.concepts);
    const doneCt = allConcepts.filter(c => {
      const t = unit.topics.find(t2 => t2.concepts.includes(c));
      return getStatus(t.code, c) === 'done';
    }).length;
    const pct = Math.round(doneCt / allConcepts.length * 100);

    const sec = document.createElement('div');
    sec.className = 'unit-section';
    sec.innerHTML = `
      <div class="unit-header">
        <div class="unit-letter" style="color:${unit.color}">${unit.unit}</div>
        <div>
          <div class="unit-name">${unit.unitName}</div>
          <div class="unit-count">${allConcepts.length} lessons · ${doneCt} completed</div>
        </div>
        <div class="unit-prog" style="color:${unit.color}">
          <div class="unit-prog-bar">
            <div class="unit-prog-fill" style="width:${pct}%;background:${unit.color}"></div>
          </div>
          ${pct}%
        </div>
      </div>`;

    unit.topics.forEach(topic => {
      topic.concepts.forEach((concept, ci) => {
        const status = getStatus(topic.code, concept);
        const cleanName = concept.replace(' ✅ DONE','');
        const isHL = topic.level === 'HL only';
        const id = getLessonId(topic.code, concept);

        const row = document.createElement('div');
        row.className = `lesson-row ${status === 'done' ? 'done' : status === 'progress' ? 'in-progress' : ''}`;
        row.innerHTML = `
          <div class="lesson-check ${status === 'done' ? 'done' : status === 'progress' ? 'in-progress' : ''}"
            onclick="cycleStatus('${topic.code}','${concept.replace(/'/g,"\\'")}')">
            ${status === 'done' ? '✓' : status === 'progress' ? '…' : ''}
          </div>
          <div class="lesson-code" style="background:${unit.color}18;color:${unit.color}">
            ${topic.code}.${String(ci+1).padStart(2,'0')}
          </div>
          <div class="lesson-name">
            <strong>${cleanName}</strong>
            <span style="color:#4D5A6E;margin-left:0.4rem;font-size:0.78rem">${topic.name}</span>
          </div>
          <span class="level-tag ${isHL ? 'level-hl' : 'level-sl'}">${topic.level}</span>
          <select class="status-select" onchange="setStatus('${topic.code}','${concept.replace(/'/g,"\\'")}',this.value)">
            <option value="todo" ${status==='todo'?'selected':''}>📝 To do</option>
            <option value="progress" ${status==='progress'?'selected':''}>🔄 In progress</option>
            <option value="done" ${status==='done'?'selected':''}>✅ Done</option>
          </select>`;
        sec.appendChild(row);
      });
    });

    container.appendChild(sec);
  });

  updateStats();
}

window.cycleStatus = function(code, concept) {
  const cur = getStatus(code, concept);
  const next = cur === 'todo' ? 'progress' : cur === 'progress' ? 'done' : 'todo';
  setStatus(code, concept, next);
};

window.setStatus = function(code, concept, status) {
  state[getLessonId(code, concept)] = status;
  saveState();
  renderAll();
};

// Copy to clipboard as plain text (Google Docs compatible)
window.copyToClipboard = function() {
  let text = 'φQ PHYSICS — LESSON CONTENT TRACKER\n';
  text += 'Mr. Fahmeed Qadir · IB Physics 2023\n';
  text += '═'.repeat(60) + '\n\n';

  LESSONS.forEach(unit => {
    text += `UNIT ${unit.unit}: ${unit.unitName}\n`;
    text += '─'.repeat(50) + '\n';
    let lessonNum = 1;
    unit.topics.forEach(topic => {
      text += `\n  ${topic.code} — ${topic.name} [${topic.level}]\n`;
      topic.concepts.forEach((concept, ci) => {
        const cleanName = concept.replace(' ✅ DONE','');
        const status = getStatus(topic.code, concept);
        const statusIcon = status === 'done' ? '✅' : status === 'progress' ? '🔄' : '☐';
        text += `    ${statusIcon}  ${topic.code}.${String(ci+1).padStart(2,'0')}  ${cleanName}\n`;
        lessonNum++;
      });
    });
    text += '\n';
  });

  text += '\n' + '═'.repeat(60) + '\n';
  text += 'HOW TO ADD LESSON HTML:\n';
  text += '1. Use the φQ Lesson Generator Prompt to generate HTML\n';
  text += '2. Paste generated code into this chat along with the lesson name\n';
  text += '3. The website will be updated automatically\n';
  text += '\nLEGEND: ☐ = To do  🔄 = In progress  ✅ = Done\n';

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ Copied!';
    btn.style.background = '#34D399';
    setTimeout(() => {
      btn.textContent = 'Copy lesson list →';
      btn.style.background = '#4F9DFF';
    }, 2500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = 'Copy lesson list →'; }, 2500);
  });
};

// Init
// Mark C.1 Concept 1 as done by default
const defaultDone = getLessonId('C.1', 'Defining Simple Harmonic Motion ✅ DONE');
if (!state[defaultDone]) { state[defaultDone] = 'done'; saveState(); }

renderAll();
</script>
</body>
</html>
